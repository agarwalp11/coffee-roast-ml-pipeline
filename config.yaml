
# Coffee Roast Preference ML Pipeline Configuration

# Google Cloud Storage
data:
  bucket_name: coffee-roast-ml-pipeline-agarwalp11
  blob_name: coffee_cleaned.csv
  local_path: data/processed/coffee_downloaded.csv

# Dataset features and target
features:
  categorical:
    - brew
    - strength
    - style
    - cups
  target: roast_level

# Data splitting
split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_state: 42

# Model configuration
model:
  type: logistic_regression
  max_iter: 1000
  random_state: 42

# Model output
output:
  model_path: models/coffee_roast_model.joblib
